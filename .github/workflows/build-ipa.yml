name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app for iPhoneOS without code signing
        run: |
          xcodebuild \
            -project SideloadTestApp.xcodeproj \
            -scheme SideloadTestApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        shell: bash
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/SideloadTestApp.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found at $APP_PATH"
            exit 1
          fi

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r SideloadTestApp-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: SideloadTestApp-unsigned-ipa
          path: build/SideloadTestApp-unsigned.ipa
          if-no-files-found: error
